# Runs both backends and both UIs with live reload:
#
#   docker compose up --watch
#
# Spring Boot http://localhost:8080 · Quarkus http://localhost:8081
# Angular http://localhost:4200 · React http://localhost:3000
#
# Needs spring-boot/.env and quarkus/.env (LAUNCHDARKLY_SDK_KEY), react/.env.local
# (VITE_LD_CLIENT_SIDE_ID) and angular/src/environments/environment.ts (clientSideID). See the
# README. Two JVMs and two Node dev servers need about 3–4 GB of memory.
name: ld-spring-angular-react

services:
  spring-boot:
    build:
      # The repo root, so the image can include launchdarkly-common.
      context: .
      dockerfile: spring-boot/Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - path: ./spring-boot/.env
        required: true
    environment:
      # Adds every certs/*.crt to the JVM trust store at startup, for TLS-inspecting proxies.
      # See certs/README.md. With no files in certs/, nothing changes.
      USE_SYSTEM_CA_CERTS: "1"
    volumes:
      # Keeps downloaded Maven dependencies between restarts. Each backend has its own cache, since
      # both install launchdarkly-common into it when they start.
      - maven-cache-spring-boot:/root/.m2
      - ./certs:/certificates:ro
    develop:
      watch:
        # Java isn't hot-swapped: an edit syncs in and restarts the container, which recompiles.
        - action: sync+restart
          path: ./spring-boot/src
          target: /app/spring-boot/src
        - action: sync+restart
          path: ./launchdarkly-common/src
          target: /app/launchdarkly-common/src
        - action: rebuild
          path: ./spring-boot/pom.xml
        - action: rebuild
          path: ./launchdarkly-common/pom.xml

  quarkus:
    build:
      context: .
      dockerfile: quarkus/Dockerfile.dev
    ports:
      - "8081:8081"
    env_file:
      - path: ./quarkus/.env
        required: true
    environment:
      USE_SYSTEM_CA_CERTS: "1"
    volumes:
      - maven-cache-quarkus:/root/.m2
      - ./certs:/certificates:ro
    develop:
      watch:
        # Quarkus dev mode reloads on the next request after an edit, without a restart.
        - action: sync
          path: ./quarkus/src
          target: /app/quarkus/src
        - action: sync
          path: ./launchdarkly-common/src
          target: /app/launchdarkly-common/src
        - action: rebuild
          path: ./quarkus/pom.xml
        - action: rebuild
          path: ./launchdarkly-common/pom.xml

  angular:
    build:
      context: ./angular
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    environment:
      SPRING_BOOT_URL: http://spring-boot:8080
      QUARKUS_URL: http://quarkus:8081
    depends_on:
      - spring-boot
      - quarkus
    develop:
      watch:
        - action: sync
          path: ./angular/src
          target: /app/src
        - action: rebuild
          path: ./angular/package.json
        - action: rebuild
          path: ./angular/angular.json

  react:
    build:
      context: ./react
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - path: ./react/.env.local
        required: true
    environment:
      SPRING_BOOT_URL: http://spring-boot:8080
      QUARKUS_URL: http://quarkus:8081
    depends_on:
      - spring-boot
      - quarkus
    develop:
      watch:
        - action: sync
          path: ./react/src
          target: /app/src
        - action: sync
          path: ./react/public
          target: /app/public
        - action: rebuild
          path: ./react/package.json
        - action: rebuild
          path: ./react/vite.config.ts

volumes:
  maven-cache-spring-boot:
  maven-cache-quarkus:
