quarkus.application.name=ld-sample-quarkus
# Spring Boot uses 8080, so both backends can run at once.
quarkus.http.port=8081
# Tests pick a free port, so they don't clash with a running dev server.
%test.quarkus.http.test-port=0

# Server-side SDK key for your environment. It's a secret: set it in the environment or in
# quarkus/.env (gitignored), which Quarkus reads on its own. Never commit it.
launchdarkly.sdk-key=${LAUNCHDARKLY_SDK_KEY:}
# Explicit init timeout. LaunchDarkly recommends 1–5s for server-side SDKs. The SDK default is 5s.
launchdarkly.start-wait=2s
# Application metadata, sent with every SDK request so LaunchDarkly can show which app and
# version connected. Quarkus sets quarkus.application.version from pom.xml.
launchdarkly.application-id=ld-spring-angular-react-quarkus
launchdarkly.application-version=${quarkus.application.version}
# Optional: route the SDK through a Relay Proxy, e.g. http://localhost:8030
# launchdarkly.relay-proxy-uri=

quarkus.log.category."com.launchdarkly".level=INFO
# The request log line from launchdarkly-common. DEBUG also logs each evaluation context, with
# emails masked.
quarkus.log.category."com.launchdarkly.sample.common.ProductService".level=INFO
